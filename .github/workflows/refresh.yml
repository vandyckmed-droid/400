name: Refresh momentum data

on:
  schedule:
    # Tuesday to Saturday at 10:00 UTC (05:00–06:00 New York): the morning
    # after each weekday close, once the vendor's adjusted bars have settled.
    # A market holiday produces no new bar; the run is then a no-op.
    - cron: '0 10 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build.py exits non-zero if the universe comes back degraded (vendor
      # throttling, a broken scrape), so a bad week never reaches main.
      # The research section (backtest, portfolio, oscillator studies) is not
      # part of this job: research.yml refreshes it on demand.
      - name: Rebuild rankings
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/build.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: refresh momentum rankings ($(date -u +%Y-%m-%d))"
          git push
