name: Refresh momentum data

# Two branches: `main` holds the code; `site` holds what GitHub Pages serves,
# the code plus data/, as a single commit rewritten on every run. History of
# the data is never kept, so the repository stays the size of one day's site.
on:
  schedule:
    # Tuesday to Saturday at 10:00 UTC (05:00–06:00 New York): the morning
    # after each weekday close, once the vendor's adjusted bars have settled.
    # A market holiday produces no new bar; the run then republishes as is.
    - cron: '0 10 * * 2-6'
  workflow_dispatch:
  # A code change merged to main republishes the site with yesterday's data,
  # without a rebuild, so it is live within a minute.
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The previous run's output: the membership snapshots build.py falls
      # back to when a source is down, and the latest.json its guards compare
      # against. main itself carries no data.
      - name: Start from the published data
        run: |
          git fetch --depth=1 origin site
          rm -rf data
          git restore --source=origin/site -- data

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'

      # build.py exits non-zero if the universe comes back degraded (vendor
      # throttling, a broken scrape), so a bad day never reaches the site.
      - name: Rebuild rankings
        if: github.event_name != 'push'
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/build.py

      # One fresh commit holding the code and the data, force-pushed to site.
      # data/ is ignored on main, so it is added by force here.
      - name: Publish the site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > site.txt
          git checkout -q --orphan site-next
          git rm -r --cached -q .
          git add -A
          git add -f data site.txt
          git commit -q -m "site: $(date -u +%Y-%m-%d) from main ${GITHUB_SHA::7}"
          git push --force origin site-next:site
