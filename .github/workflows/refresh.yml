name: Refresh momentum data

on:
  schedule:
    # Saturday 12:00 UTC — after Friday's US close has settled with the vendor.
    - cron: '0 12 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build.py exits non-zero if the universe comes back degraded (vendor
      # throttling, a broken scrape), so a bad week never reaches main.
      - name: Rebuild rankings
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/build.py

      - name: Refresh backtest
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/backtest.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: refresh momentum rankings ($(date -u +%Y-%m-%d))"
          git push
